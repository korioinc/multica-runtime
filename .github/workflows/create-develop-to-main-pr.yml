name: Create develop into main PR

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: create-develop-to-main-pr
  cancel-in-progress: false

jobs:
  create-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether develop is ahead of main
        id: branch-state
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main develop

          read -r main_only_commit_count develop_only_commit_count < <(
            git rev-list --left-right --count origin/main...origin/develop
          )

          echo "main_only_commit_count=${main_only_commit_count}" >> "$GITHUB_OUTPUT"
          echo "develop_only_commit_count=${develop_only_commit_count}" >> "$GITHUB_OUTPUT"

          if [ "$develop_only_commit_count" -eq 0 ]; then
            echo "should_create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_create=true" >> "$GITHUB_OUTPUT"

      - name: Check for an existing PR
        id: existing-pr
        if: steps.branch-state.outputs.should_create == 'true'
        shell: bash
        run: |
          set -euo pipefail

          pr_count="$(gh pr list \
            --base main \
            --head develop \
            --state open \
            --json number \
            --jq 'length')"

          if [ "$pr_count" -gt 0 ]; then
            echo "should_create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_create=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.branch-state.outputs.should_create == 'true' && steps.existing-pr.outputs.should_create == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if ! create_output="$(
            gh pr create \
              --base main \
              --head develop \
              --assignee jskorlol \
              --title "Merge develop into main" \
              --body "" \
              2>&1
          )"; then
            if printf '%s\n' "$create_output" | grep -Fq 'A pull request already exists'; then
              echo "Skipped: PR already exists."
              exit 0
            fi

            printf '%s\n' "$create_output" >&2
            exit 1
          fi

          printf '%s\n' "$create_output"
