name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching VERSION
        required: true
        type: string
      expected_revision:
        description: Full commit SHA originally selected for this release
        required: true
        type: string

permissions: {}
concurrency:
  group: runtime-release
  cancel-in-progress: false
  queue: max
env:
  IMAGE: ghcr.io/korioinc/multica-runtime

jobs:
  plan:
    # The workflow and release control must come from protected main.
    # The requested tag and revision identify source data only.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
    outputs:
      published: ${{ steps.plan.outputs.published }}
      version: ${{ steps.plan.outputs.version }}
      revision: ${{ steps.plan.outputs.revision }}
    steps:
      - name: Check out trusted release control from the main event revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Authorize the requested source before checking it out
        run: |
          set -euo pipefail
          fail() { printf 'release blocked: %s\n' "$*" >&2; exit 1; }
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || fail 'a full source commit SHA is required'
          # shellcheck source=scripts/release-lib.sh
          source "$GITHUB_WORKSPACE/control/scripts/release-lib.sh"
          version_stable "$RELEASE_TAG"
          scratch=$(mktemp -d "$RUNNER_TEMP/release-authority.XXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          release_command=authorize
          # shellcheck source=.github/scripts/github-lib.sh
          source "$GITHUB_WORKSPACE/control/.github/scripts/github-lib.sh"
          github_require_main_revision "$EXPECTED_REVISION"
          owner=$(github_tag_revision "$RELEASE_TAG" true)
          [[ "$owner" == "$EXPECTED_REVISION" ]] || fail 'release tag identifies another commit'
      - name: Check out the authorized release source as data
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.expected_revision }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: plan
        name: Validate the release tag, VERSION and original main commit
        run: >-
          control/.github/scripts/release.sh --root "$GITHUB_WORKSPACE/source"
          --image "$IMAGE" --revision "$EXPECTED_REVISION" --version "$RELEASE_TAG" plan

  verify:
    needs: plan
    if: needs.plan.outputs.published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate runtime inputs and release automation
        run: |
          shellcheck scripts/*.sh .github/scripts/*.sh
          scripts/inputs.sh check --production
          scripts/verify-tag-version.sh
          scripts/verify-release.sh

  native:
    needs: [plan, verify]
    if: needs.plan.outputs.published != 'true'
    env:
      RELEASE_REVISION: ${{ needs.plan.outputs.revision }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out trusted release control from the main event revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.revision }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - id: buildx
        uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: candidate
        name: Reuse verified candidate bytes on retry
        run: >-
          control/.github/scripts/release.sh --root "$GITHUB_WORKSPACE/source"
          --image "$IMAGE" --revision "$RELEASE_REVISION"
          --version "$RELEASE_VERSION"
          prepare-native --platform '${{ matrix.platform }}'
      - name: Build the native runtime image
        if: steps.candidate.outputs.reuse != 'true'
        # Separate native caches retain intermediate installation stages across runners.
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          control/.github/scripts/build-native.sh --root "$GITHUB_WORKSPACE/source" \
            --image '${{ steps.candidate.outputs.image }}' \
            --version "$RELEASE_VERSION" --platform '${{ matrix.platform }}' \
            --cache-from "type=registry,ref=${IMAGE}:buildcache-${{ matrix.arch }}" \
            --cache-to "type=registry,ref=${IMAGE}:buildcache-${{ matrix.arch }},mode=max"
      - name: Verify the final image natively before uploading candidate bytes
        run: >-
          control/.github/scripts/release.sh --root "$GITHUB_WORKSPACE/source"
          --image "$IMAGE" --revision "$RELEASE_REVISION"
          --version "$RELEASE_VERSION"
          record-native --platform '${{ matrix.platform }}'
          --records "$RUNNER_TEMP/native-results"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: runtime-native-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-results/*.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, verify, native]
    if: >-
      always() && needs.plan.result == 'success' &&
      ((needs.plan.outputs.published == 'true' && needs.native.result == 'skipped') ||
       (needs.verify.result == 'success' && needs.native.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_REVISION: ${{ needs.plan.outputs.revision }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check out trusted release control from the main event revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.revision }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        if: needs.plan.outputs.published != 'true'
        with:
          pattern: runtime-native-*
          path: ${{ runner.temp }}/native-results
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tagged version and promote it when newer than latest
        run: >-
          control/.github/scripts/release.sh --root "$GITHUB_WORKSPACE/source"
          --image "$IMAGE" --revision "$RELEASE_REVISION"
          --version "$RELEASE_VERSION"
          publish --records "$RUNNER_TEMP/native-results"
