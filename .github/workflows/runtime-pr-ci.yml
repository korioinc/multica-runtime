name: Runtime PR CI

on:
  pull_request:
    branches: [develop, main]

permissions: {}

concurrency:
  group: runtime-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  context:
    name: check-context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve the exact PR head
        id: resolve
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          head_sha=$EVENT_HEAD
          number=$EVENT_NUMBER
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Invalid head SHA.' >&2; exit 1;
          }
          [[ "$number" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Invalid PR number.' >&2; exit 1;
          }
          pr=$(gh api "repos/$GH_REPO/pulls/$number")
          jq -e --argjson number "$number" \
            '.number == $number and
             (.state == "open" or .state == "closed") and
             (.head.sha | type == "string" and test("^[0-9a-f]{40}$")) and
             (.base.ref | type == "string" and length > 0)' \
            <<<"$pr" >/dev/null || {
              echo 'Invalid PR response from GitHub.' >&2; exit 1;
            }
          reason=$(jq -r --arg head_sha "$head_sha" '
            if .state == "closed" then "PR is already closed or merged."
            elif .head.sha != $head_sha then "PR head changed since this run was queued."
            elif .base.ref != "develop" and .base.ref != "main" then "PR no longer targets develop or main."
            else "" end' <<<"$pr")
          if [[ -n "$reason" ]]; then
            printf 'Skipping PR #%s: %s\n' "$number" "$reason" | tee -a "$GITHUB_STEP_SUMMARY"
            echo 'should_run=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'should_run=true'
            echo "head_sha=$head_sha"
          } >>"$GITHUB_OUTPUT"

  verify:
    name: verify
    needs: context
    if: needs.context.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate shell scripts, version inputs and release automation
        run: |
          shellcheck scripts/*.sh .github/scripts/*.sh
          scripts/inputs.sh check --production
          scripts/verify-tag-version.sh
          scripts/verify-release.sh

  runtime-image:
    name: runtime-image
    needs: context
    if: needs.context.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CI_IMAGE: multica-runtime-ci:${{ needs.context.outputs.head_sha }}
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and verify the native runtime image
        run: |
          scripts/build-image.sh --image "$CI_IMAGE" --platform linux/amd64 \
            --cache-from 'type=registry,ref=ghcr.io/korioinc/multica-runtime:buildcache-amd64'
          scripts/verify-image.sh --image "$CI_IMAGE"
