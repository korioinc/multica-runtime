[unix_http_server]
file=%(ENV_XDG_RUNTIME_DIR)s/supervisor.sock
chmod=0600

[supervisord]
logfile=%(ENV_XDG_RUNTIME_DIR)s/supervisord.log
logfile_maxbytes=1MB
logfile_backups=1
pidfile=%(ENV_XDG_RUNTIME_DIR)s/supervisord.pid
childlogdir=%(ENV_XDG_RUNTIME_DIR)s
environment=XDG_CONFIG_HOME="%(ENV_XDG_RUNTIME_DIR)s/config",XDG_CACHE_HOME="%(ENV_XDG_RUNTIME_DIR)s/cache",XDG_DATA_HOME="%(ENV_XDG_RUNTIME_DIR)s/data"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_XDG_RUNTIME_DIR)s/supervisor.sock

[program:dbus]
command=/usr/bin/dbus-daemon --session --nofork --address=%(ENV_DBUS_SESSION_BUS_ADDRESS)s
priority=10
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3
stdout_logfile=%(ENV_XDG_RUNTIME_DIR)s/dbus.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_MULTICA_DESKTOP_SCREEN)s -nolisten tcp -auth %(ENV_XAUTHORITY)s -noreset
priority=10
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3
stdout_logfile=%(ENV_XDG_RUNTIME_DIR)s/xvfb.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true

[program:openbox]
command=/usr/bin/openbox --sm-disable
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3
stdout_logfile=%(ENV_XDG_RUNTIME_DIR)s/openbox.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true
